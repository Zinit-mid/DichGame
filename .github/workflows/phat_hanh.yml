name: Dong goi va phat hanh

# Tu chay khi day the phien ban (vd: v6.1.1). Co the bam chay tay trong tab Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dong-goi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai thu vien
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          foreach ($p in Get-Content requirements_them.txt) {
            python -m pip install $p
            if ($LASTEXITCODE -ne 0) { Write-Host "Bo qua $p (cai loi)"; $global:LASTEXITCODE = 0 }
          }

      - name: Kiem tra so phien ban khop voi the
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String -Path dich_game.py -Pattern 'APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "APP_VERSION=$v khong khop the ${{ github.ref_name }}" }

      - name: Dong goi DichGame.exe
        shell: pwsh
        run: >
          python -m PyInstaller --noconfirm --onefile --noconsole --name DichGame
          --icon icon.ico --add-data "icon.ico;."
          --collect-all winocr --collect-all winrt --collect-all windows_capture
          --collect-all bettercam --collect-all dxcam --collect-all comtypes
          dich_game.py

      - name: Tao goi phat hanh
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force phat_hanh | Out-Null
          Copy-Item dist/DichGame.exe phat_hanh/DichGame.exe
          Compress-Archive -Force -Path dich_game.py,icon.ico,requirements.txt,requirements_them.txt,chay_thu.bat,dong_goi_exe.bat,HUONG_DAN.txt -DestinationPath phat_hanh/DichGame.zip

      - name: Luu file (khi chay tay)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: DichGame
          path: phat_hanh/*

      - name: Dang Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Dịch Game ${{ github.ref_name }}
          body_path: GHI_CHU_PHAT_HANH.md
          files: |
            phat_hanh/DichGame.exe
            phat_hanh/DichGame.zip
