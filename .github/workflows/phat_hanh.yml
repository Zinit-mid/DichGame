name: Dong goi va phat hanh

# Tu chay khi day code len main: neu APP_VERSION trong dich_game.py chua co Release
# thi dong goi exe va dang Release moi (tu tao the vX.Y.Z). Co the bam chay tay trong tab Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dong-goi:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Doc so phien ban
        id: pb
        shell: pwsh
        run: |
          $v = (Select-String -Path dich_game.py -Pattern 'APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          "the=v$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "co_roi=1" >> $env:GITHUB_OUTPUT; Write-Host "Release v$v da co - bo qua" }
          else { "co_roi=0" >> $env:GITHUB_OUTPUT; Write-Host "Se dang Release v$v" }
          $global:LASTEXITCODE = 0

      - uses: actions/setup-python@v5
        if: steps.pb.outputs.co_roi == '0'
        with:
          python-version: "3.12"

      - name: Cai thu vien
        if: steps.pb.outputs.co_roi == '0'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          foreach ($p in Get-Content requirements_them.txt) {
            python -m pip install $p
            if ($LASTEXITCODE -ne 0) { Write-Host "Bo qua $p (cai loi)"; $global:LASTEXITCODE = 0 }
          }

      - name: Dong goi DichGame.exe
        if: steps.pb.outputs.co_roi == '0'
        shell: pwsh
        run: >
          python -m PyInstaller --noconfirm --onefile --noconsole --name DichGame
          --icon icon.ico --add-data "icon.ico;." --add-data "danh_muc.json;." --hidden-import viet_hoa --hidden-import viet_hoa_cd --hidden-import viet_hoa_rottr --hidden-import crimson_desert --collect-submodules cryptography
          --collect-all winocr --collect-all winrt --collect-all windows_capture
          --collect-all bettercam --collect-all dxcam --collect-all comtypes --collect-all ctranslate2 --collect-all sentencepiece --collect-all edge_tts --collect-all pycaw
          dich_game.py

      - name: Tao goi phat hanh
        if: steps.pb.outputs.co_roi == '0'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force phat_hanh | Out-Null
          Copy-Item dist/DichGame.exe phat_hanh/DichGame.exe
          Compress-Archive -Force -Path dich_game.py,viet_hoa.py,viet_hoa_cd.py,crimson_desert.py,danh_muc.json,icon.ico,requirements.txt,requirements_them.txt,chay_thu.bat,dong_goi_exe.bat,HUONG_DAN.txt -DestinationPath phat_hanh/DichGame.zip

      - name: Dang Release
        if: steps.pb.outputs.co_roi == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pb.outputs.the }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          name: Dịch Game ${{ steps.pb.outputs.the }}
          body_path: GHI_CHU_PHAT_HANH.md
          files: |
            phat_hanh/DichGame.exe
            phat_hanh/DichGame.zip
